# CD: deploy production on merge (or direct push) to `production`.
#
# Tag resolution is identical to deploy-staging.yaml: CI only builds+pushes on
# push to `development`, so the deploy tag comes from the merge commit's
# development-side parent (HEAD^2).
# => Merge PRs into production with "Create a merge commit" (or fast-forward);
#    squash/rebase merges break the HEAD^2 relationship and this workflow
#    falls back to HEAD with a ::warning:: — which may reference images CI
#    never built (the rollout gate then fails loudly on ImagePullBackOff).
# The `production` GitHub environment (P4) adds a required-reviewer approval
# gate before this job's steps execute.
name: Deploy production

on:
  push:
    branches: [production]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Deploy this tag instead of the merge commit (e.g. sha-abcd123 or abcd123)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  deploy-production:
    name: deploy (production)
    runs-on: [self-hosted, deploy-local]
    environment: production
    # Serialize production deploys; never cancel a rollout already in flight.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      # Full history so the merge commit's second parent (HEAD^2) exists.
      - name: Check out repository (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve image coordinates
        id: img
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          # Same lowercase-owner rule as CI (GHCR requires lowercase names);
          # tr lowercases, not a bash-4 expansion — macOS runner shell is 3.2.
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "prefix=ghcr.io/$owner" >> "$GITHUB_OUTPUT"
          if [ -n "$INPUT_TAG" ]; then
            # Manual override (workflow_dispatch): accept sha-abc1234 or bare abc1234.
            case "$INPUT_TAG" in
              sha-*) tag="$INPUT_TAG" ;;
              *)     tag="sha-$INPUT_TAG" ;;
            esac
            echo "deploy tag from dispatch input: $tag"
          elif git rev-parse --verify --quiet HEAD^2 >/dev/null; then
            # Merge commit: second parent is the development side — the commit
            # CI actually built. Cut exactly 7 chars (--short=N may emit more
            # on ambiguous prefixes, and CI tags are always 7).
            tag="sha-$(git rev-parse HEAD^2 | cut -c1-7)"
            echo "deploy tag from merge commit's development parent (HEAD^2): $tag"
          else
            # Direct push to production (not a merge commit): best effort —
            # deploy HEAD's commit and warn; it is only deployable if that
            # commit was also ever pushed to development (CI only builds it).
            echo "::warning::production HEAD is not a merge commit — deploying HEAD's tag; merge development PRs with 'Create a merge commit'"
            tag="sha-$(git rev-parse HEAD | cut -c1-7)"
            echo "deploy tag fallback (HEAD): $tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Deploy production overlay
        # Composite actions cannot read the `secrets` context — the token is
        # injected via env (stays masked in logs).
        uses: ./.github/actions/deploy-env
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        with:
          env: prod
          image_prefix: ${{ steps.img.outputs.prefix }}
          image_tag: ${{ steps.img.outputs.tag }}
