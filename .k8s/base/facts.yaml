# Facts service: FastAPI :8000, /health probe. Calls counter via its
# in-namespace Service DNS name (overridden per environment is unnecessary —
# the short name resolves in whatever namespace both live in).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: facts
  labels:
    app.kubernetes.io/name: facts
    app.kubernetes.io/part-of: github-actions
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: facts
  template:
    metadata:
      labels:
        app.kubernetes.io/name: facts
        app.kubernetes.io/part-of: github-actions
    spec:
      containers:
      - name: facts
        image: github-actions/facts:p0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
        env:
        - name: COUNTER_URL
          value: http://counter:3000
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 2
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: facts
  labels:
    app.kubernetes.io/name: facts
    app.kubernetes.io/part-of: github-actions
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: facts
  ports:
  - name: http
    port: 8000
    targetPort: http
