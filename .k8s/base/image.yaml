# Image service: Go :8080, /healthz probe (k8s liveness/readiness convention).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: image
  labels:
    app.kubernetes.io/name: image
    app.kubernetes.io/part-of: github-actions
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: image
  template:
    metadata:
      labels:
        app.kubernetes.io/name: image
        app.kubernetes.io/part-of: github-actions
    spec:
      # ghcr-pull: used only when the kubelet actually pulls (private GHCR
      # images deployed by CD). Local dev preloads images, so never consulted.
      imagePullSecrets:
      - name: ghcr-pull
      containers:
      - name: image
        image: github-actions/image:p0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 2
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: image
  labels:
    app.kubernetes.io/name: image
    app.kubernetes.io/part-of: github-actions
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: image
  ports:
  - name: http
    port: 8080
    targetPort: http
