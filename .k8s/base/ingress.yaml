# Ingress cilab — one host per environment (the host is replaced by every
# overlay), all paths through the frontend, which is already the /api gateway.
# Served by ingress-nginx on the kind extraPortMapping: http://localhost:8080
# with `curl --resolve <env-host>:8080:127.0.0.1` (no /etc/hosts edit needed).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cilab
  labels:
    app.kubernetes.io/name: cilab-ingress
    app.kubernetes.io/part-of: cilab
spec:
  ingressClassName: nginx
  rules:
  - host: cilab.local  # placeholder — each overlay's patch replaces this
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
