# kind cluster config for github-actions — NOT a Kubernetes resource: never `kubectl apply` this file.
# Same recipe as the k8slab lab: 1 control-plane (labeled ingress-ready, host port 8080 -> node 80)
# + 2 workers, so ingress-nginx answers at http://localhost:8080 and pods spread over real nodes.
# Cluster name is passed on the command line (`task cluster-create` runs
#   kind create cluster --config .k8s/kind-cluster.yaml --name github-actions).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "ingress-ready=true"
  extraPortMappings:
  - containerPort: 80
    hostPort: 8080
    protocol: TCP
- role: worker
- role: worker
