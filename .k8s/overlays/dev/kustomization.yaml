# dev overlay: namespace cilab-dev, host dev.cilab.local, 1 replica each
# (base defaults). Identical to staging except namespace/host.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- namespace.yaml
- ../../base

namespace: cilab-dev

patches:
- patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: dev.cilab.local
  target:
    kind: Ingress
    name: cilab
