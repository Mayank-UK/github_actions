# development overlay: namespace github-actions-development, host
# development.github-actions.test, 1 replica each (base defaults). Identical to
# staging except namespace/host.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- namespace.yaml
- ../../base

namespace: github-actions-development

patches:
- patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: development.github-actions.test
  target:
    kind: Ingress
    name: github-actions
