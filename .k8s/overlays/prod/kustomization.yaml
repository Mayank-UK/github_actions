# prod overlay: namespace github-actions-prod, host prod.github-actions.local, 2 replicas of
# every service (the replicas transformer rewrites spec.replicas per name).
# Everything else identical to dev/staging.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- namespace.yaml
- ../../base

namespace: github-actions-prod

replicas:
- name: facts
  count: 2
- name: counter
  count: 2
- name: image
  count: 2
- name: frontend
  count: 2

patches:
- patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: prod.github-actions.local
  target:
    kind: Ingress
    name: github-actions
