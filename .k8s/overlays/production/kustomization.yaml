# production overlay: namespace github-actions-production, host
# production.github-actions.test, 2 replicas of every service (the replicas
# transformer rewrites spec.replicas per name). Everything else identical to
# development/staging.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- namespace.yaml
- ../../base

namespace: github-actions-production

replicas:
- name: facts
  count: 2
- name: counter
  count: 2
- name: image
  count: 2
- name: frontend
  count: 2

patches:
- patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: production.github-actions.test
  target:
    kind: Ingress
    name: github-actions
