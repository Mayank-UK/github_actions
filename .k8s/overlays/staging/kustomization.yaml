# staging overlay: namespace github-actions-staging, host staging.github-actions.test,
# 1 replica each (base defaults). Identical to development except namespace/host.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- namespace.yaml
- ../../base

namespace: github-actions-staging

patches:
- patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: staging.github-actions.test
  target:
    kind: Ingress
    name: github-actions
